version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: drishti_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: drishti_x
      POSTGRES_USER: drishti_admin
      POSTGRES_PASSWORD: drishti_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drishti_admin -d drishti_x"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: drishti_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://drishti_admin:drishti_secure_password@db:5432/drishti_x
      FRONTEND_URL: http://localhost:3000
      SECRET_KEY: drishti_secret_key_production_replace_me
      UPLOAD_DIR: /app/uploads
      REPORTS_DIR: /app/reports
      MODEL_DIR: /app/models/weights
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_reports:/app/reports
      - backend_weights:/app/models/weights
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: drishti_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  backend_uploads:
  backend_reports:
  backend_weights:

